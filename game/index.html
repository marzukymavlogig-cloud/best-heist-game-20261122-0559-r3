<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Amber Museum — Rook's Last Job</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a14; display: flex; align-items: center; justify-content: center; }
  #game { width: min(100vw, calc(100vh * 1280 / 860)); height: auto; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="860" aria-label="The Amber Museum: a top-down heist game. Sneak past guards and cameras, loot three rooms, crack the safe and escape with the Sun Opal."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
